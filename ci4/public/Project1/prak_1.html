<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Membuat Heading dan Paragraph</title>
</head>

<body>

    <img src="img/nabila.jpeg" width="200" alt="Foto Nabila">
    <br><br>

    <table border="1" cellpadding="8" cellspacing="0">

        <tr>
            <td>Nama</td>
            <td>:</td>
            <td>Nabila Putri Ardina</td>
        </tr>

        <tr>
            <td>TTL</td>
            <td>:</td>
            <td>Tenggarong, 08 Desember 2005</td>
        </tr>

        <tr>
            <td>Prodi</td>
            <td>:</td>
            <td>Sistem Informasi</td>
        </tr>

        <tr>
            <td>Gender</td>
            <td>:</td>
            <td>Perempuan</td>
        </tr>

    </table>

    <hr>

    <h1>Heading ke-1</h1>
    <h2>Heading ke-2</h2>
    <h3>Heading ke-3</h3>
    <h4>Heading ke-4</h4>
    <h5>Heading ke-5</h5>
    <h6>Heading ke-6</h6>

    <p>
        <strong>Ini adalah contoh paragraph</strong>
    </p>

</body>

</html>
