<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Profile Nabila</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Montserrat&family=Great+Vibes&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            padding: 60px 20px;

            background: linear-gradient(135deg, #ffe4ec, #e8f0ff, #fff0f5);
            background-size: 400% 400%;
            animation: gradientMove 12s ease infinite;

            overflow-x: hidden;
        }

        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        body::before {
            content: "";
            position: fixed;
            width: 100%;
            height: 100%;
            background-image: url("https://www.transparenttextures.com/patterns/stardust.png");
            opacity: 0.15;
            pointer-events: none;
        }

        .card {
            width: 360px;
            padding: 30px;

            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(15px);

            border-radius: 25px;
            border: 1px solid rgba(255, 182, 193, 0.4);

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);

            text-align: center;
            position: relative;

            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 48px;
            color: #c96b8b;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 13px;
            color: #777;
            margin-bottom: 15px;
        }

        img {
            width: 200px;
            height: 250px;
            object-fit: cover;

            border-radius: 50% / 40%;
            border: 5px solid #ffd6e7;

            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        table {
            margin: 15px auto;
            text-align: left;
            font-size: 14px;
            color: #555;
        }

        td {
            padding: 5px 10px;
        }

        hr {
            border: none;
            height: 1px;
            margin: 20px 0;
            background: linear-gradient(to right, transparent, #e8c2cf, transparent);
        }

        .quote {
            background: #fff5f8;
            padding: 15px;

            border-radius: 12px;
            border: 1px dashed #e3b2c1;

            font-style: italic;
            color: #666;
            line-height: 1.6;
        }

        .quote span {
            display: block;
            margin-top: 10px;
            font-weight: 600;
            color: #c96b8b;
        }

        .back-btn {
            text-align: center;
            margin-top: 20px;
        }

        .back-btn a {
            background: #c96b8b;
            color: white;

            padding: 6px 10px;
            border-radius: 14px;

            text-decoration: none;
            font-size: 11px;
            font-weight: 500;

            display: inline-block;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);

            transition: 0.2s ease;
        }

        .back-btn a:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Hi! I'm Nabila</h1>

        <div class="subtitle">about me</div>

        <img src="img/biya profile.jpeg" alt="Foto Nabila">

        <table>
            <tr>
                <td>Nama</td>
                <td>:</td>
                <td>Nabila Putri Ardina</td>
            </tr>
            <tr>
                <td>TTL</td>
                <td>:</td>
                <td>Tenggarong, 08 Desember 2005</td>
            </tr>
            <tr>
                <td>Prodi</td>
                <td>:</td>
                <td>Sistem Informasi</td>
            </tr>
            <tr>
                <td>Gender</td>
                <td>:</td>
                <td>Perempuan</td>
            </tr>
        </table>

        <hr>

        <div class="quote">
            “Semua proses jatuh bangun adalah bagian dari perjalanan.
            Waktu akan memberi jawaban yang tepat.”
            <span>-biya-</span>
        </div>

        <div class="back-btn">
            <a href="portofolio.html" class="btn">Kunjungi Portofolio</a>
            <a href="prak_1.html">Kembali ke Beranda</a>
        </div>

    </div>

</body>

</html>
