    <style>
        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;

            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #ffe4ec, #e8f0ff, #fff0f5);
            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;
        }

        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .box {
            text-align: center;
        }

        h1 {
            color: #c96b8b;
            font-family: 'Playfair Display', serif;
            margin-bottom: 30px;
        }

        table {
            margin: auto;
            border-spacing: 25px;
        }

        /* KOTAK BESAR */
        .card {
            width: 330px;
            min-height: 220px;

            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);

            padding: 25px;
            border-radius: 20px;

            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);

            text-align: left;
        }

        .card h3 {
            text-align: center;
            color: #c96b8b;
            margin-bottom: 15px;
        }

        ul {
            padding-left: 20px;
        }

        li {
            margin-bottom: 10px;
        }

        a {
            text-decoration: none;
            color: #555;
            font-size: 14px;
            transition: 0.2s;
        }

        a:hover {
            color: #c96b8b;
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 8px 14px;
            background: #c96b8b;
            color: white;
            text-decoration: none;
            border-radius: 18px;
            font-size: 13px;
        }
    </style>
</head>

<body>
